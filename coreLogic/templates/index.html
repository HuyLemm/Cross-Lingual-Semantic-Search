<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cross-lingual Semantic Search</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <!-- HEADER -->
  <header class="container-fluid py-3 app-header">
    <div class="d-flex align-items-center justify-content-between gap-3">
      <!-- LEFT: logo + DOCUMENT FOLDER button (góc trái) -->
      <div class="logo-left d-flex flex-column align-items-start gap-2">
        <a class="header-corner-link header-corner-absolute" href="/documents">📁 Document Folder</a>
        </a>
        <img src="{{ url_for('static', filename='images/logo_truong.png') }}" alt="Logo Trường">
      </div>

      <!-- CENTER -->
      <div class="text-center hero">
        <h3>CÔNG CỤ KIỂM TRA ĐỘ TƯƠNG ĐỒNG VĂN BẢN XUYÊN NGỮ</h3>
        <div class="muted">Semantic Search & Cross-lingual Retrieval</div>
      </div>

      <!-- RIGHT -->
      <div class="logo-right">
        <img src="{{ url_for('static', filename='images/logo_khoa.png') }}" alt="Logo Khoa">
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">
    <div class="card-panel">
      <form id="search-form">
        <div class="mb-3">
          <label class="form-label">Nội dung nhập</label>
          <textarea
            id="inputText"
            class="form-control"
            rows="4"
            placeholder="Nhập câu hỏi hoặc đoạn văn cần tìm tương đồng..."
            required
          ></textarea>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">Chế độ tìm kiếm</label>
            <select class="form-select" id="search_mode">
              <option value="en">Search tiếng Anh</option>
              <option value="vi">Search tiếng Việt</option>
              <option value="vi_to_en">Xuyên ngữ (Việt → Anh)</option>
              <option value="en_to_vi">Xuyên ngữ (Anh → Việt)</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Top-K kết quả</label>
            <select class="form-select" id="top_k">
              <option value="1">Top 1</option>
              <option value="3" selected>Top 3</option>
              <option value="5">Top 5</option>
              <option value="10">Top 10</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Loại truy vấn</label>
            <select class="form-select" id="input_type">
              <option value="question" selected>Câu hỏi</option>
              <option value="context">Đoạn văn (tìm đoạn gần giống)</option>
            </select>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-search">🔍 Tìm kiếm</button>
        </div>
      </form>
    </div>

    <div id="results" class="mt-4"></div>
  </main>

  <footer class="app-footer">
    © 2025 – Khóa luận tốt nghiệp – Khoa Công nghệ Thông tin
  </footer>

  <script>
    const form = document.getElementById("search-form");
    const resultsDiv = document.getElementById("results");
  
    function escapeHtml(str) {
      if (!str) return "";
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  
    function extractContent(rawText) {
      if (!rawText) return "";
      const marker = "[CONTENT]";
      const idx = rawText.indexOf(marker);
      if (idx !== -1) return rawText.substring(idx + marker.length).trim();
      return rawText.trim();
    }
  
    function prettyFileName(filename) {
      if (!filename) return "";
      let name = filename.trim();
      name = name.split("/").pop().split("\\").pop();
  
      name = name.replace(/^\d{4}\.\d{4,6}v\d+[\._-]+/i, "");
      name = name.replace(/^\d{6,14}[\._-]+/i, "");
  
      name = name.replaceAll("_", " ");
      return name;
    }
  
    function prettyTitle(title) {
      if (!title) return "";
      return title.replaceAll("_", " ");
    }
  
    // --- Highlight helpers ---
    function normalizeToken(s) {
      return (s || "")
        .toLowerCase()
        .normalize("NFKC")
        .replace(/[^\p{L}\p{N}]+/gu, " ")   // giữ chữ/số unicode
        .trim();
    }
  
    function getStopwords() {
      // tối giản để tránh highlight quá nhiều từ vô nghĩa
      return new Set([
        // EN
        "the","a","an","and","or","to","of","in","on","for","with","is","are","was","were","be","been","being",
        "this","that","these","those","it","as","at","by","from","than","then","so","such","into","about",
        // VI
        "và","hoặc","là","của","trong","trên","cho","với","từ","đến","về","như","thì","lại","một","các","những",
        "được","bị","khi","này","đó","ấy","tại"
      ]);
    }
  
    function buildQueryTokenSet(query) {
      const stop = getStopwords();
      const norm = normalizeToken(query);
      if (!norm) return new Set();
  
      const toks = norm.split(/\s+/).filter(Boolean);
      const out = new Set();
      for (const t of toks) {
        if (t.length < 3) continue;      // bỏ từ quá ngắn
        if (stop.has(t)) continue;
        out.add(t);
      }
      return out;
    }
  
    function highlightTextToHtml(text, query) {
      const tokenSet = buildQueryTokenSet(query);
      if (!text) return "";
      if (tokenSet.size === 0) return escapeHtml(text);
  
      const re = /[\p{L}\p{N}]+/gu; // match từ unicode
      let out = "";
      let lastIdx = 0;
  
      for (const m of text.matchAll(re)) {
        const start = m.index;
        const end = start + m[0].length;
  
        // phần trước token
        out += escapeHtml(text.slice(lastIdx, start));
  
        const original = m[0];
        const key = normalizeToken(original);
  
        if (tokenSet.has(key)) {
          out += `<mark class="hl">${escapeHtml(original)}</mark>`;
        } else {
          out += escapeHtml(original);
        }
  
        lastIdx = end;
      }
  
      // phần còn lại
      out += escapeHtml(text.slice(lastIdx));
      return out;
    }
  
    function renderResults(results, queryUsed) {
      resultsDiv.innerHTML = "";
  
      results.forEach((item, i) => {
        const fileRaw = item.file || "";
        const filePretty = prettyFileName(fileRaw);
        const titlePretty = prettyTitle(item.title || "");
  
        const mainTitle = filePretty || titlePretty || "Không có tiêu đề";
        const subTitle = (titlePretty && titlePretty !== mainTitle) ? titlePretty : "";
  
        const contentPlain = extractContent(item.text || "");
        const contextHtml = highlightTextToHtml(contentPlain, queryUsed || "");
  
        const fileParam = fileRaw ? encodeURIComponent(fileRaw) : "";
  
        const actionHtml = fileRaw
          ? `<a class="btn-download" href="/download?file=${fileParam}" role="button">⬇ Tải văn bản</a>`
          : `<button class="btn-download btn-disabled" type="button" disabled>⬇ Tải văn bản</button>`;
  
        resultsDiv.innerHTML += `
          <div class="result-card">
            <div class="result-grid">
              <div class="result-left">
                <div class="result-head">
                  <div class="result-rank">#${i + 1}</div>
                  <div class="result-title" title="${escapeHtml(mainTitle)}">${escapeHtml(mainTitle)}</div>
                </div>
  
                ${subTitle ? `<div class="result-subtitle" title="${escapeHtml(subTitle)}">${escapeHtml(subTitle)}</div>` : ""}
  
                <div class="result-context-label">Context</div>
                <div class="result-context-box">${contextHtml}</div>
              </div>
  
              <div class="result-right">
                <div class="action-box">
                  ${actionHtml}
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }
  
    form.onsubmit = async (e) => {
      e.preventDefault();
      resultsDiv.innerHTML = "<p class='muted'>⏳ Đang tìm kiếm...</p>";
  
      const payload = {
        text: document.getElementById("inputText").value,
        search_mode: document.getElementById("search_mode").value,
        top_k: parseInt(document.getElementById("top_k").value, 10),
        input_type: document.getElementById("input_type").value
      };
  
      const res = await fetch("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
  
      const data = await res.json();
  
      if (data.error) {
        resultsDiv.innerHTML = `<div class='alert alert-warning'>Lỗi: ${escapeHtml(data.error)}</div>`;
        return;
      }
  
      if (!data.results || data.results.length === 0) {
        resultsDiv.innerHTML = "<div class='alert alert-warning'>Không tìm thấy kết quả phù hợp.</div>";
        return;
      }
  
      // dùng query_used từ backend để highlight cho đúng ngôn ngữ/refine
      renderResults(data.results, data.query_used || payload.text);
    };
  </script>  
</body>
</html>
